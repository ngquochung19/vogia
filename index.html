<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Women's Day 20/10 ❤️</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100vh;
            overflow: hidden; /* Khóa hoàn toàn thanh cuộn */
        }

        body {
            font-family: 'Quicksand', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            perspective: 1000px;
            
            /* Phông nền trái tim cố định */
            background-image: url('https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=1200&q=80');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Lớp phủ làm mờ cố định toàn trang */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 240, 243, 0.45); 
            backdrop-filter: blur(10px); 
            -webkit-backdrop-filter: blur(10px);
            z-index: 1;
        }

        /* Container chính dạng Card (có hiệu ứng nghiêng 3D) */
        .container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            border-radius: 28px;
            padding: 24px;
            max-width: 440px;
            width: 90%;
            max-height: 95vh;
            text-align: center;
            box-shadow: 0 12px 35px rgba(223, 115, 143, 0.2);
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s ease-out;
            transform-style: preserve-3d;
        }

        /* Tiêu đề hiện đại */
        h1 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            color: #d81b60;
            font-size: 1.9rem;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        /* Khung ảnh Polaroid */
        .photo-frame {
            width: 255px;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            padding: 10px 10px 24px 10px;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
            margin: 8px auto;
            transform: rotate(-2deg);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.9);
            cursor: pointer;
        }

        .photo-frame:hover {
            transform: rotate(0deg) scale(1.04);
            box-shadow: 0 15px 30px rgba(216, 27, 96, 0.25);
        }

        .photo-frame img {
            width: 100%;
            height: 230px;
            object-fit: cover;
            border-radius: 8px;
            display: block;
        }

        /* Bức thư chúc */
        .letter {
            font-size: 0.95rem;
            color: #4a4a4a;
            line-height: 1.4;
            margin-top: 6px;
            text-align: center;
        }

        /* Hiệu ứng sticker & trái tim bay */
        .floating-item {
            position: absolute;
            user-select: none;
            pointer-events: none;
            animation: floatUp 5s linear infinite;
            z-index: 5;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.12));
        }

        @keyframes floatUp {
            0% {
                transform: translateY(105vh) scale(0.6) rotate(0deg);
                opacity: 1;
            }
            85% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1.2) rotate(360deg);
                opacity: 0;
            }
        }

        /* ===== Polaroid nhỏ xếp xung quanh tấm thẻ ===== */
        .polaroid-wall {
            position: absolute;
            inset: 0;
            z-index: 4; /* dưới icon/chữ bay (5, 6) và dưới tấm thẻ chính (10) */
            pointer-events: none;
        }

        .polaroid {
            position: absolute;
            width: clamp(64px, 8.5vw, 108px); /* kích thước mỗi tấm: chỉnh tại đây */
            transform: translate(-50%, -50%);
            transition: transform 0.3s ease;
            pointer-events: auto;
        }

        .polaroid:hover {
            transform: translate(-50%, -50%) scale(1.25);
            z-index: 2;
        }

        .polaroid-inner {
            background: rgba(255, 255, 255, 0.92);
            padding: 5px 5px 18px 5px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 6px 16px rgba(216, 27, 96, 0.18);
            cursor: pointer;
            transform: rotate(var(--rot));
            animation:
                polaroidIn 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) both,
                polaroidBob var(--bob) ease-in-out infinite;
            animation-delay: var(--delay), calc(var(--delay) + 0.7s);
        }

        .polaroid-inner img {
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 3px;
        }

        /* Hiện ra lần lượt từng tấm */
        @keyframes polaroidIn {
            from { opacity: 0; transform: rotate(var(--rot)) scale(0.3) translateY(20px); }
            to   { opacity: 1; transform: rotate(var(--rot)) scale(1) translateY(0); }
        }

        /* Sau đó đung đưa rất nhẹ */
        @keyframes polaroidBob {
            0%, 100% { transform: rotate(var(--rot)) translateY(0); }
            50%      { transform: rotate(calc(var(--rot) + 2deg)) translateY(-5px); }
        }

        @media (prefers-reduced-motion: reduce) {
            .polaroid-inner { animation: none; }
        }

        /* ===== Dòng chữ nhỏ mềm mại bay lên rồi mờ dần ===== */
        .floating-text {
            position: absolute;
            top: 0;
            white-space: nowrap;
            user-select: none;
            pointer-events: none;
            z-index: 6; /* đổi thành 15 nếu muốn chữ bay đè lên trên tấm thẻ */

            font-family: 'Quicksand', sans-serif;
            font-weight: 600;
            letter-spacing: 0.3px;
            color: #d81b60;
            /* Viền sáng mờ giúp chữ dễ đọc trên cả nền sáng lẫn tối */
            text-shadow:
                0 0 6px rgba(255, 255, 255, 0.95),
                0 0 14px rgba(255, 255, 255, 0.7),
                0 2px 8px rgba(216, 27, 96, 0.25);

            opacity: 0;
            animation-name: floatText;
            animation-timing-function: ease-out;
            animation-fill-mode: forwards;
            /* animation-duration và --drift được JS đặt ngẫu nhiên */
        }

        @keyframes floatText {
            0% {
                transform: translate(0, 105vh) scale(0.85);
                opacity: 0;
            }
            12% {
                opacity: 1; /* hiện dần lên */
            }
            55% {
                opacity: 1;
            }
            100% {
                transform: translate(var(--drift, 0px), -10vh) scale(1);
                opacity: 0; /* mờ dần rồi biến mất */
            }
        }

        /* Cấu hình Popup phóng to ảnh (Modal) */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal.show {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            max-width: 85vw;
            max-height: 80vh;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            transform: scale(0.7);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 4px solid #ffffff;
        }

        .modal.show .modal-content {
            transform: scale(1);
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 25px;
            color: white;
            font-size: 35px;
            font-weight: bold;
            cursor: pointer;
            z-index: 101;
        }
    </style>
</head>
<body>

    <!-- Các tấm polaroid nhỏ xếp xung quanh (được tạo bằng JS) -->
    <div class="polaroid-wall" id="polaroidWall"></div>

    <div class="container" id="cardContainer">
        <h1>HAPPY 20/10! ❤️</h1>
        
        <!-- Khung ảnh Polaroid (Click để phóng to) -->
        <div class="photo-frame" onclick="openPhoto()">
            <img id="mainImg" src="love.jpg" alt="Our Memory">
        </div>

        <div class="letter">
            <p>Always be grateful ! 🌸</p>
        </div>
    </div>

    <!-- Popup phóng to ảnh -->
    <div class="modal" id="photoModal" onclick="closePhoto()">
        <span class="close-btn">&times;</span>
        <img class="modal-content" id="expandedImg">
    </div>

    <script>
        // Danh sách bao gồm Trái tim, Hoa và các Sticker dễ thương (Chiikawa, Usagi, Hachiware, Loopy,...)
        const symbols = [
            '❤️', '💖', '💕', '🌸', '💐', '🌷', '✨',
            '🎀', '🧁', '🍓', '🧸'
        ];

        function createFloatingItem() {
            const item = document.createElement('div');
            item.classList.add('floating-item');
            
            const randomSymbol = symbols[Math.floor(Math.random() * symbols.length)];
            item.innerHTML = randomSymbol;

            item.style.left = Math.random() * 100 + 'vw';
            item.style.animationDuration = Math.random() * 2 + 4 + 's';
            item.style.fontSize = Math.random() * 15 + 28 + 'px'; // Kích thước to rõ, sinh động
            
            document.body.appendChild(item);

            setTimeout(() => {
                item.remove();
            }, 6000);
        }

        // Tần suất xuất hiện sticker và trái tim
        setInterval(createFloatingItem, 200);

        // ===== Dòng chữ chúc bay lên =====
        // Sửa / thêm / bớt lời chúc tại đây
        const messages = [
            'bin iu nu 💕',
            'Dung doi anh mu TvT ',
            'Hong biết nu thích cái này hong ta ',
            'Một món quà nho nhỏ cho em ne 🎁',
            'Kiểm tra tốt nhen 🍀✨',
            'Always be grateful 🌸',
            'Hạnh phúc và vui vẻ 💐',
            'Mãi slay nhe mom 🌷',
            'Nàng thơ thì xênh còn bó bông thì màu xanh 🎀',
            'Cảm ơn em vì đã lun ở đây 🧸',
            'Mong là em sẽ thích tấm này 🖼️',
            'Ê, ta làm đẹp khôm',
            'Mốt dẫn tiểu thư đi chụp hình tiếp 📷',
            'Gửi thêm hình cho anh ii 🥺🙏, anh thêm vào cho đẹp'
        ];

        // Xáo trộn để lần lượt hiện hết các câu, không lặp liên tục một câu
        let bag = [];
        function nextMessage() {
            if (bag.length === 0) {
                bag = [...messages].sort(() => Math.random() - 0.5);
            }
            return bag.pop();
        }

        function createFloatingText() {
            const text = document.createElement('div');
            text.classList.add('floating-text');
            text.textContent = nextMessage();

            text.style.fontSize = (Math.random() * 3 + 14) + 'px'; // nhỏ, nhẹ: 14–17px
            text.style.animationDuration = (Math.random() * 3 + 7) + 's'; // chậm hơn icon để dễ đọc: 7–10s
            text.style.setProperty('--drift', (Math.random() * 60 - 30) + 'px'); // trôi nhẹ sang hai bên

            document.body.appendChild(text);

            // Đặt vị trí ngang sau khi đo độ rộng, để chữ không bị tràn ra mép màn hình
            const maxLeft = Math.max(window.innerWidth - text.offsetWidth - 40, 0);
            text.style.left = (20 + Math.random() * maxLeft) + 'px';

            text.addEventListener('animationend', () => text.remove());
        }

        // Tần suất xuất hiện dòng chữ (ms): thưa hơn icon để không rối mắt
        setInterval(createFloatingText, 1600);

        // ===== Polaroid nhỏ xếp xung quanh tấm thẻ =====
        // Bỏ ảnh vào thư mục "photos" cạnh file HTML rồi khai báo tên file ở đây.
        // Thêm/bớt bao nhiêu ảnh cũng được, các tấm sẽ tự chia đều xung quanh.
        const photos = [
            'photos/1.jpg',
            'photos/2.jpg',
            'photos/3.jpg',
            'photos/4.jpg',
            'photos/5.jpg',
            'photos/6.jpg',
            'photos/7.jpg',
            'photos/8.jpg',
            'photos/9.jpg'
        ];

        function preloadImage(src) {
            return new Promise(resolve => {
                const img = new Image();
                img.onload = () => resolve(src);
                img.onerror = () => resolve(null); // thiếu file thì bỏ qua
                img.src = src;
            });
        }

        async function buildPolaroids() {
            const wall = document.getElementById('polaroidWall');
            const loaded = (await Promise.all(photos.map(preloadImage))).filter(Boolean);

            loaded.forEach((src, i) => {
                const el = document.createElement('div');
                el.className = 'polaroid';
                el.innerHTML = '<div class="polaroid-inner"><img alt="" draggable="false"></div>';
                el.querySelector('img').src = src;

                el.style.setProperty('--rot', (Math.random() * 24 - 12).toFixed(1) + 'deg'); // nghiêng ngẫu nhiên
                el.style.setProperty('--delay', (0.3 + i * 0.12).toFixed(2) + 's');          // hiện lần lượt
                el.style.setProperty('--bob', (4 + Math.random() * 2).toFixed(1) + 's');     // nhịp đung đưa
                el.dataset.jx = Math.random() - 0.5; // lệch vị trí nhẹ cho tự nhiên
                el.dataset.jy = Math.random() - 0.5;

                el.addEventListener('click', () => openPhoto(src)); // bấm để phóng to
                wall.appendChild(el);
            });

            layoutPolaroids();
        }

        function layoutPolaroids() {
            const els = Array.from(document.querySelectorAll('#polaroidWall .polaroid'));
            const n = els.length;
            if (n === 0) return;

            const vw = window.innerWidth;
            const vh = window.innerHeight;
            const cardEl = document.getElementById('cardContainer');
            const cardL = (vw - cardEl.offsetWidth) / 2;
            const cardR = cardL + cardEl.offsetWidth;
            const cardT = (vh - cardEl.offsetHeight) / 2;
            const cardB = cardT + cardEl.offsetHeight;
            const pw = els[0].offsetWidth;
            const ph = els[0].offsetHeight;

            // Đặt tâm tấm ảnh tại (x, y), giữ trong khung màn hình
            const place = (el, x, y) => {
                x += Number(el.dataset.jx) * pw * 0.25;
                y += Number(el.dataset.jy) * ph * 0.25;
                x = Math.min(vw - pw / 2 - 4, Math.max(pw / 2 + 4, x));
                y = Math.min(vh - ph / 2 - 4, Math.max(ph / 2 + 4, y));
                el.style.left = x + 'px';
                el.style.top = y + 'px';
            };

            const sideRoom = Math.min(cardL, vw - cardR);

            if (sideRoom >= pw) {
                // Màn rộng (máy tính, tablet): xếp thành vòng elip quanh tấm thẻ
                const rx = vw / 2 - pw / 2 - 12;
                const ry = vh / 2 - ph / 2 - 10;
                els.forEach((el, i) => {
                    const angle = -Math.PI / 2 + (i / n) * Math.PI * 2;
                    let x = vw / 2 + Math.cos(angle) * rx;
                    let y = vh / 2 + Math.sin(angle) * ry;

                    // Nếu rơi vào phía sau tấm thẻ thì đẩy ngang ra ngoài
                    const behindCard =
                        x > cardL - pw * 0.4 && x < cardR + pw * 0.4 &&
                        y > cardT - ph * 0.4 && y < cardB + ph * 0.4;
                    if (behindCard) x = x < vw / 2 ? cardL - pw * 0.7 : cardR + pw * 0.7;

                    place(el, x, y);
                });
            } else {
                // Màn hẹp (điện thoại dọc): xếp thành hàng ở dải phía trên và phía dưới tấm thẻ
                const topCount = Math.ceil(n / 2);
                const groups = [
                    { items: els.slice(0, topCount), yMin: 0, yMax: cardT },
                    { items: els.slice(topCount), yMin: cardB, yMax: vh }
                ];
                groups.forEach(({ items, yMin, yMax }) => {
                    const k = items.length;
                    const band = yMax - yMin;
                    const step = (vw - pw - 8) / Math.max(k - 1, 1);
                    items.forEach((el, j) => {
                        const x = k === 1 ? vw / 2 : pw / 2 + 4 + j * step;
                        // So le hai tầng nếu dải đủ cao, không thì một hàng ở giữa dải
                        const level = band > ph * 1.8 ? (j % 2 ? 0.7 : 0.3) : 0.5;
                        place(el, x, yMin + band * level);
                    });
                });
            }
        }

        let polaroidResizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(polaroidResizeTimer);
            polaroidResizeTimer = setTimeout(layoutPolaroids, 150);
        });
        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(layoutPolaroids); // font tải xong thì tính lại chiều cao thẻ
        }
        buildPolaroids();

        // Tính năng phóng to ảnh (Modal)
        function openPhoto(src) {
            const modal = document.getElementById('photoModal');
            const mainImg = document.getElementById('mainImg');
            const expandedImg = document.getElementById('expandedImg');
            
            expandedImg.src = src || mainImg.src;
            modal.classList.add('show');
        }

        function closePhoto() {
            const modal = document.getElementById('photoModal');
            modal.classList.remove('show');
        }

        // Hiệu ứng nghiêng 3D theo con trỏ chuột
        const card = document.getElementById('cardContainer');
        
        document.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        document.addEventListener('mouseleave', () => {
            card.style.transform = `rotateY(0deg) rotateX(0deg)`;
        });
    </script>
</body>
</html>
